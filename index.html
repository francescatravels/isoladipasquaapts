<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Isola di Pasqua – Seafront Apartments</title>
<meta name="description" content="Family-run seaside apartments with direct access to the promenade. Simple, comfortable and authentic holidays.">

<style>
:root{
  --primary:#0F4C5C;
  --primary-dark:#0b3b47;
  --bg:#f4f1ec;
  --surface:#ffffff;
  --text:#1f2933;
  --muted:#6b7280;
  --radius:16px;
  --shadow:0 18px 40px rgba(0,0,0,.15);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(255,255,255,.95);
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
}

.lang-switch button{
  margin-left:6px;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid var(--primary);
  background:#fff;
  cursor:pointer;
  font-weight:600;
}
.lang-switch button.active{
  background:var(--primary);
  color:#fff;
}

/* BUTTONS */
.btn{
  padding:10px 16px;
  border-radius:999px;
  font-weight:600;
  text-decoration:none;
  display:inline-block;
}

.btn.primary{
  background:var(--primary);
  color:#fff;
}

.btn.soft{
  border:1px solid var(--primary);
  color:var(--primary);
}

/* HERO */
.hero{
  max-width:1200px;
  margin:40px auto;
  padding:40px;
  background:linear-gradient(135deg,#0F4C5C,#08343f);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.hero-box{
  max-width:520px;
  background:#fff;
  padding:28px;
  border-radius:var(--radius);
}

.features{
  margin-top:16px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.feature{
  background:#f7fafb;
  padding:8px 14px;
  border-radius:999px;
  font-size:.9rem;
}

/* LAYOUT */
main{
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:260px 1fr;
  gap:30px;
}

aside{
  background:var(--surface);
  padding:20px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  height:fit-content;
}

aside a{
  display:block;
  padding:10px;
  text-decoration:none;
  color:var(--text);
  border-radius:10px;
}

section{
  background:#fff;
  padding:30px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin-bottom:30px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

/* RESPONSIVE */
@media(max-width:900px){
  main{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">IP</div>
      <div>
        <strong>Isola di Pasqua</strong><br>
        <span data-i18n="subtitle">Seafront Apartments</span>
      </div>
    </div>

    <div class="lang-switch">
      <button onclick="setLang('it')" class="active">IT</button>
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('de')">DE</button>
    </div>
  </div>
</header>

<section class="hero">
  <div class="hero-box">
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroText"></p>

    <div style="margin-top:16px">
      <a href="#appartamenti" class="btn primary" data-i18n="ctaMain"></a>
      <a href="#contatti" class="btn soft" data-i18n="ctaSecondary"></a>
    </div>

    <div class="features">
      <div class="feature" data-i18n="f1"></div>
      <div class="feature" data-i18n="f2"></div>
      <div class="feature" data-i18n="f3"></div>
      <div class="feature" data-i18n="f4"></div>
    </div>
  </div>
</section>

<main>
<aside>
  <a href="#chi" data-i18n="nav1"></a>
  <a href="#appartamenti" data-i18n="nav2"></a>
  <a href="#perche" data-i18n="nav3"></a>
  <a href="#contatti" data-i18n="nav4"></a>
</aside>

<div>
<section id="chi">
  <h2 data-i18n="aboutTitle"></h2>
  <p data-i18n="aboutText"></p>
</section>

<section id="appartamenti">
  <h2 data-i18n="aptTitle"></h2>
  <p data-i18n="aptText"></p>
</section>

<section id="perche">
  <h2 data-i18n="whyTitle"></h2>
  <p data-i18n="whyText"></p>
</section>

<section id="contatti">
  <h2 data-i18n="contactTitle"></h2>
  <p data-i18n="contactText"></p>
</section>
</div>
</main>

<footer>
  © Isola di Pasqua
</footer>

function setLang(lang){
 document.querySelectorAll("[data-i18n]").forEach(el=>{
   el.innerText = translations[lang][el.dataset.i18n];
 });
 document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.remove("active"));
 event.target.classList.add("active");
}

setLang("it");
</script>

</body>
</html>
