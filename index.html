          data-it="Suggerimento: compila check-in e check-out per ricevere una risposta più veloce."
          data-de="Hinweis: Bitte geben Sie Check-in und Check-out an, um schneller eine Antwort zu erhalten.">
          Suggerimento: compila check-in e check-out per ricevere una risposta più veloce.
        </div>
      </div>
    </div>
  </div>

  <script>
    const PHONE_E164 = "393358408583";
    const EMAIL_TO   = "boatto-ger@libero.it";

    function setLang(lang) {
      document.querySelectorAll('[data-it]').forEach(el => {
        const v = el.getAttribute('data-' + lang);
        if (v !== null) el.innerHTML = v;
      });
      document.querySelectorAll('[data-it-placeholder]').forEach(el => {
        const ph = el.getAttribute('data-' + lang + '-placeholder');
        if (ph !== null) el.setAttribute('placeholder', ph);
      });
      localStorage.setItem('siteLang', lang);
    }

    function getCurrentLang(){ return localStorage.getItem('siteLang') || 'it'; }
    function t(it, de){ return (getCurrentLang() === 'de') ? de : it; }

    document.addEventListener('DOMContentLoaded', () => {
      setLang(getCurrentLang());
      const yearEl = document.getElementById("year");
      if (yearEl) yearEl.textContent = new Date().getFullYear();
    });

    const modal = document.getElementById("modal");
    const closeModalBtn = document.getElementById("closeModal");
    const modalTitle = document.getElementById("modalTitle");

    const fType = document.getElementById("fType");
    const fGuests = document.getElementById("fGuests");
    const fIn = document.getElementById("fIn");
    const fOut = document.getElementById("fOut");
    const fMsg = document.getElementById("fMsg");

    const sendWA = document.getElementById("sendWA");
    const sendMail = document.getElementById("sendMail");

    function openModal(type="Generale", preferredAction="whatsapp"){
      fType.value = type;
      fGuests.value = "";
      fIn.value = "";
      fOut.value = "";
      fMsg.value = "";

      modalTitle.textContent = (preferredAction === "email")
        ? t("Richiesta via Email", "Anfrage per E-Mail")
        : t("Richiesta su WhatsApp", "Anfrage per WhatsApp");

      modal.style.display = "flex";
    }

    function closeModal(){ modal.style.display = "none"; }

    function buildText(){
      const type = fType.value || t("Generale","Allgemein");
      const guests = fGuests.value ? `${t("Persone","Personen")}: ${fGuests.value}` : "";
      const inD = fIn.value ? `Check-in: ${fIn.value}` : `Check-in: ${t("(da indicare)","(bitte angeben)")}`;
      const outD = fOut.value ? `Check-out: ${fOut.value}` : `Check-out: ${t("(da indicare)","(bitte angeben)")}`;
      const extra = fMsg.value ? `\n\n${t("Messaggio","Nachricht")}: ${fMsg.value}` : "";

      return [
        t("Ciao, vorrei informazioni su:", "Hallo, ich hätte gerne Informationen zu:"),
        `${t("Tipologia","Wohnungstyp")}: ${type}`,
        guests,
        inD,
        outD,
        `\n${t("Grazie!","Vielen Dank!")}`
      ].filter(Boolean).join("\n") + extra;
    }

    function sendWhatsApp(){
      const url = `https://wa.me/${PHONE_E164}?text=${encodeURIComponent(buildText())}`;
      window.open(url, "_blank");
    }

    function sendEmail(){
      const subject = `${t("Richiesta informazioni","Informationsanfrage")} – ${fType.value || "Isola di Pasqua"}`;
      const body = buildText() + `\n\n—\n${t("Inviato dal sito Isola di Pasqua","Gesendet über die Website Isola di Pasqua")}`;
      window.location.href = `mailto:${EMAIL_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    document.querySelectorAll("[data-open-form]").forEach(el=>{
      el.addEventListener("click", (e)=>{
        e.preventDefault();
        openModal(el.getAttribute("data-open-form") || "Generale", el.getAttribute("data-action") || "whatsapp");
      });
    });

    closeModalBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });

    sendWA.addEventListener("click", (e)=>{ e.preventDefault(); sendWhatsApp(); });
    sendMail.addEventListener("click", (e)=>{ e.preventDefault(); sendEmail(); });
  </script>
</body>
</html>
